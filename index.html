<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Descarga música MP3</title>
<style>
  /* Reset simple */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: 'Segoe UI', Tahoma,
     Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  /* Contenedor general */
  #app {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* Ocultar main-app con hidden (con display:none para evitar flash) */
  #main-app[hidden] {
    display: none !important;
  }

  /* LOGIN */
  #login-screen {
    flex: 1;
    display: true;
    justify-content: center;
    align-items: center;
    background: #fff;
    padding: 20px;
  }
  #login-screen form {
    background: #f9f9f9;
    border-radius: 10px;
    padding: 30px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    width: 100%;
    max-width: 320px;
  }
  #login-screen h2 {
    margin-bottom: 20px;
    color: #333;
  }
  #login-screen label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #555;
  }
  #login-screen input[type="text"],
  #login-screen input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 20px;
    border-radius: 6px;
    border: 1.5px solid #ddd;
    font-size: 1rem;
  }
  #login-screen button {
    width: 100%;
    padding: 12px;
    font-size: 1.1rem;
    border: none;
    border-radius: 6px;
    background: #4CAF50;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  #login-screen button:hover {
    background: #45a049;
  }
  #login-error {
    color: red;
    margin-bottom: 10px;
    font-weight: 600;
    display: none;
  }

  /* HEADER */
  header {
    background-color: #ff6f91;
    color: white;
    padding: 15px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
  }
  header h1 {
    font-size: 1.8rem;
  }

  /* MENÚ HAMBURGUESA */
  .hamburger {
    cursor: pointer;
    width: 30px;
    height: 22px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .hamburger div {
    height: 4px;
    background: white;
    border-radius: 2px;
    transition: all 0.3s ease;
  }
  /* Animación hamburguesa cuando activo */
  .hamburger.active div:nth-child(1) {
    transform: rotate(45deg) translate(5px, 5px);
  }
  .hamburger.active div:nth-child(2) {
    opacity: 0;
  }
  .hamburger.active div:nth-child(3) {
    transform: rotate(-45deg) translate(7px, -7px);
  }

  nav {
    position: absolute;
    top: 60px;
    left: 0;
    width: 100%;
    background: #ff6f91;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
    z-index: 10;
  }
  nav.open {
    max-height: 300px; /* suficiente para 6 opciones */
  }
  nav ul {
    list-style: none;
  }
  nav ul li {
    border-bottom: 1px solid rgba(255,255,255,0.3);
  }
  nav ul li a {
    display: block;
    padding: 12px 20px;
    color: white;
    text-decoration: none;
    font-weight: 600;
    transition: background-color 0.2s ease;
  }
  nav ul li a:hover {
    background-color: rgba(255,255,255,0.2);
  }

  /* BUSCADOR */
  #search-container {
    padding: 15px 20px;
    background-color: #fff;
    box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    display: flex;
    justify-content: center;
  }
  #search-input {
    width: 100%;
    max-width: 600px;
    padding: 10px 15px;
    font-size: 1rem;
    border: 2px solid #ff6f91;
    border-radius: 30px;
    outline-color: #ff6f91;
    transition: box-shadow 0.3s ease;
  }
  #search-input:focus {
    box-shadow: 0 0 8px #ff6f91;
  }

  /* LISTADO DE CANCIONES */
  #songs-list {
    flex: 1;
    padding: 20px;
    background: #f1f6f9;
    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
    max-width: 900px;
    margin: 0 auto;
  }
  @media(min-width: 700px) {
    #songs-list {
      grid-template-columns: 1fr 1fr;
    }
  }

  .song {
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
    padding: 10px 15px;
    gap: 15px;
  }
  .song img {
    width: 80px;
    height: 80px;
    border-radius: 10px;
    object-fit: cover;
    flex-shrink: 0;
  }
  .song-details {
    flex: 1;
  }
  .song-title {
    font-weight: 700;
    color: #333;
    margin-bottom: 6px;
  }
  .song-controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .song-controls button,
  .song-controls a.download-btn {
    background: #ff6f91;
    border: none;
    color: white;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: background-color 0.3s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .song-controls button:hover,
  .song-controls a.download-btn:hover {
    background: #e85d7a;
  }
  .song-controls button:disabled {
    background: #ccc;
    cursor: not-allowed;
  }

  /* PAGINACION */
  #pagination {
    margin: 20px auto 40px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  #pagination button {
    background: #ff6f91;
    border: none;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  #pagination button:disabled {
    background: #ccc;
    cursor: not-allowed;
  }
  #pagination button:hover:not(:disabled) {
    background: #e85d7a;
  }

  /* FOOTER */
  footer {
    background: #ff6f91;
    color: white;
    text-align: center;
    padding: 15px 10px;
    font-weight: 600;
    margin-top: auto;
  }

  /* AUDIO PLAYER */
  audio {
    outline: none;
    width: 150px;
  }
  
</style>
</head>
<body>

  <div id="app">
  <!-- LOGIN -->
  <section id="login-screen" aria-label="Pantalla de inicio de sesión">
    <form id="login-form" autocomplete="off" aria-describedby="login-error" aria-label="Formulario de inicio de sesión">
      <h2>Iniciar sesión</h2>
      <div id="login-error" role="alert"></div>
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" placeholder="Usuario" required autocomplete="username" />
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="Contraseña" required autocomplete="current-password" />
      <button type="submit" aria-label="Iniciar sesión">Entrar</button>
    </form>
  </section>

  
  <!-- APLICACIÓN -->
  <section id="main-app" hidden>
    <header>
      <h1>Descarga música MP3</h1>
      <div class="hamburger" id="hamburger" role="button" aria-label="Menú de navegación" aria-expanded="false" tabindex="0">
        <div></div>
        <div></div>
        <div></div>
      </div>
      <nav id="nav-menu" aria-label="Menú principal">
        <ul>
          <li><a href="pagina1.html">Página 1</a></li>
          <li><a href="pagina2.html">Página 2</a></li>
          <li><a href="pagina3.html">Página 3</a></li>
          <li><a href="pagina4.html">Página 4</a></li>
          <li><a href="pagina5.html">Página 5</a></li>
          <li><a href="pagina6.html">Página 6</a></li>
        </ul>
      </nav>
      <button id="logout-btn" title="Cerrar sesión" style="
        background: #333;
        border: none;
        color: white;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        transition: background-color 0.3s ease;
        margin-left: 15px;
      ">Cerrar sesión</button>
    </header>

    <div id="search-container">
      <input type="search" id="search-input" placeholder="Buscar canciones..." aria-label="Buscar canciones" />
    </div>

    <main>
      <div id="songs-list" aria-live="polite" aria-relevant="additions"></div>
      <div id="pagination" role="navigation" aria-label="Paginación de canciones">
        <button id="prev-btn" aria-label="Página anterior">Anterior</button>
        <button id="next-btn" aria-label="Página siguiente">Siguiente</button>
      </div>
    </main>

    <footer>® Juan 2026</footer>
  </section>

</div>

<script>
(() => {
  // Datos de canciones: 30 canciones con título, URL MP3 y URL imagen carátula
  // Para ejemplo usaremos URL genéricos (puedes reemplazarlos con tus URLs de GitHub)
  const songs = Array.from({ length: 10 }, (_, i) => ({
    id: i + 1,
    title: `Canción número ${i + 1}`,
    audioUrl:`aqui enlace de musica`, // mismo audio para ejemplo
    coverUrl: `https://picsum.photos/seed/cancion${i + 1}/200/200`
  }));

  // Variables paginación
  const PAGE_SIZE = 25;
  let currentPage = 1;
  let filteredSongs = [...songs];

  // Elementos DOM
  const loginScreen = document.getElementById('login-screen');
  const loginForm = document.getElementById('login-form');
  const loginError = document.getElementById('login-error');
  const mainApp = document.getElementById('main-app');

  const hamburger = document.getElementById('hamburger');
  const navMenu = document.getElementById('nav-menu');

  const searchInput = document.getElementById('search-input');
  const songsList = document.getElementById('songs-list');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');

  const logoutBtn = document.getElementById('logout-btn');

  let currentAudio = null; // Para control del audio en reproducción

  // Función para mostrar error login
  function showLoginError(msg) {
    loginError.textContent = msg;
    loginError.style.display = msg ? 'block' : 'none';
  }

  // Función para mostrar la app y ocultar login
  function showApp() {
    loginScreen.hidden = true;
    mainApp.hidden = false;
  }

  // Función para mostrar login y ocultar app
  function showLogin() {
    loginScreen.hidden = false;
    mainApp.hidden = true;
  }

  // Verificar login almacenado al cargar página
  function checkLogin() {
    const loggedIn = localStorage.getItem('loggedIn');
    if (loggedIn === 'true') {
      showApp();
      renderSongs();
      updatePaginationButtons();
      showWelcomeMessage();
    } else {
      showLogin();
    }
  }

  // Login
  loginForm.addEventListener('submit', e => {
    e.preventDefault();
    const username = loginForm.username.value.trim();
    const password = loginForm.password.value;

    if (username === 'admin' && password === '1234') {
      // Autenticado
      showLoginError('');
      localStorage.setItem('loggedIn', 'true');
      showApp();
      loginForm.reset();
      renderSongs();
      updatePaginationButtons();
      showWelcomeMessage();
    } else {
      showLoginError('Usuario o contraseña incorrectos.');
    }
  });

  // Logout
  logoutBtn.addEventListener('click', () => {
    // Pausar audio si está sonando
    if (currentAudio) {
      currentAudio.pause();
      resetPlayButton(currentAudio.playBtn);
      currentAudio = null;
    }
    localStorage.removeItem('loggedIn');
    showLogin();
  });

  // Menú hamburguesa toggle
  function toggleMenu() {
    const expanded = hamburger.getAttribute('aria-expanded') === 'true';
    hamburger.setAttribute('aria-expanded', String(!expanded));
    hamburger.classList.toggle('active');
    navMenu.classList.toggle('open');
  }
  hamburger.addEventListener('click', toggleMenu);
  hamburger.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      toggleMenu();
    }
  });

  // Filtrar canciones por búsqueda
  function filterSongs(query) {
    if (!query) {
      filteredSongs = [...songs];
    } else {
      const lowerQuery = query.toLowerCase();
      filteredSongs = songs.filter(song => song.title.toLowerCase().includes(lowerQuery));
    }
    currentPage = 1;
  }

  searchInput.addEventListener('input', e => {
    filterSongs(e.target.value);
    renderSongs();
    updatePaginationButtons();
  });

  // Renderizar lista de canciones paginada
  function renderSongs() {
    songsList.innerHTML = '';
    if (filteredSongs.length === 0) {
      songsList.innerHTML = '<p>No se encontraron canciones.</p>';
      return;
    }
    const start = (currentPage - 1) * PAGE_SIZE;
    const end = start + PAGE_SIZE;
    const pageSongs = filteredSongs.slice(start, end);

    pageSongs.forEach(song => {
      // Crear elementos
      const songDiv = document.createElement('div');
      songDiv.className = 'song';

      const img = document.createElement('img');
      img.src = song.coverUrl;
      img.alt = `Carátula de ${song.title}`;
      img.loading = 'lazy';

      const detailsDiv = document.createElement('div');
      detailsDiv.className = 'song-details';

      const title = document.createElement('div');
      title.className = 'song-title';
      title.textContent = song.title;

      const controls = document.createElement('div');
      controls.className = 'song-controls';

      // Audio element
      const audio = document.createElement('audio');
      audio.src = song.audioUrl;
      audio.preload = 'none'; // Optimizar carga
      audio.controls = false;
      audio.setAttribute('aria-label', `Reproductor de audio para ${song.title}`);

      // Botón Play/Pause
      const playBtn = document.createElement('button');
      playBtn.textContent = '▶️';
      playBtn.title = 'Reproducir / Pausar';
      playBtn.setAttribute('aria-pressed', 'false');
      playBtn.addEventListener('click', () => {
        if (currentAudio && currentAudio !== audio) {
          // Detener otro audio
          currentAudio.pause();
          resetPlayButton(currentAudio.playBtn);
        }
        if (audio.paused) {
          audio.play()
            .catch(err => {
              alert('No se pudo reproducir el audio.');
              console.error(err);
            });
          playBtn.textContent = '⏸️';
          playBtn.setAttribute('aria-pressed', 'true');
          currentAudio = audio;
          currentAudio.playBtn = playBtn;
        } else {
          audio.pause();
          playBtn.textContent = '▶️';          playBtn.setAttribute('aria-pressed', 'false');
          currentAudio = null;
        }
      });

      // Actualizar botón al terminar audio
      audio.addEventListener('ended', () => {
        playBtn.textContent = '▶️';
        playBtn.setAttribute('aria-pressed', 'false');
        if (currentAudio === audio) currentAudio = null;
      });

      // Guardar referencia para controlar múltiples audios
      audio.playBtn = playBtn;

      // Botón descarga
      const downloadLink = document.createElement('a');
      downloadLink.href = song.audioUrl;
      downloadLink.download = `${song.title}.mp3`;
      downloadLink.textContent = 'Descargar';
      downloadLink.className = 'download-btn';
      downloadLink.setAttribute('aria-label', `Descargar ${song.title}`);

      // Añadir elementos al DOM
      controls.appendChild(playBtn);
      controls.appendChild(downloadLink);
      detailsDiv.appendChild(title);
      detailsDiv.appendChild(controls);
      songDiv.appendChild(img);
      songDiv.appendChild(detailsDiv);
      songDiv.appendChild(audio);

      songsList.appendChild(songDiv);
    });
  }

  // Resetear botón play a estado inicial
  function resetPlayButton(button) {
    if (button) {
      button.textContent = '▶️';
      button.setAttribute('aria-pressed', 'false');
    }
  }

  // Actualizar botones de paginación
  function updatePaginationButtons() {
    const totalPages = Math.ceil(filteredSongs.length / PAGE_SIZE);
    prevBtn.disabled = currentPage <= 1;
    nextBtn.disabled = currentPage >= totalPages || totalPages === 0;
  }

  prevBtn.addEventListener('click', () => {
    if (currentPage > 1) {
      currentPage--;
      renderSongs();
      updatePaginationButtons();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });

  nextBtn.addEventListener('click', () => {
    const totalPages = Math.ceil(filteredSongs.length / PAGE_SIZE);
    if (currentPage < totalPages) {
      currentPage++;
      renderSongs();
      updatePaginationButtons();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });

  // Cerrar menú hamburguesa al hacer clic fuera
  document.addEventListener('click', e => {
    if (!navMenu.contains(e.target) && !hamburger.contains(e.target)) {
      hamburger.classList.remove('active');
      navMenu.classList.remove('open');
      hamburger.setAttribute('aria-expanded', 'false');
    }
  });

  // Cerrar menú con Escape
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && navMenu.classList.contains('open')) {
      hamburger.classList.remove('active');
      navMenu.classList.remove('open');
      hamburger.setAttribute('aria-expanded', 'false');
      hamburger.focus();
    }
  });

  // Mostrar mensaje de bienvenida
  function showWelcomeMessage() {
    const welcome = document.createElement('div');
    welcome.textContent = '¡Bienvenido, admin!';
    welcome.style.position = 'fixed';
    welcome.style.top = '10px';
    welcome.style.right = '10px';
    welcome.style.background = '#4CAF50';
    welcome.style.color = 'white';
    welcome.style.padding = '10px 15px';
    welcome.style.borderRadius = '8px';
    welcome.style.boxShadow = '0 4px 8px rgba(0,0,0,0.2)';
    welcome.style.zIndex = '1000';
    document.body.appendChild(welcome);
    setTimeout(() => {
      welcome.remove();
    }, 3000);
  }

  // Control para que solo un audio se reproduzca a la vez
  songsList.addEventListener('play', e => {
    if (e.target.tagName === 'AUDIO') {
      if (currentAudio && currentAudio !== e.target) {
        currentAudio.pause();
        resetPlayButton(currentAudio.playBtn);
      }
      currentAudio = e.target;
    }
  }, true);

  // Inicializar la app verificando el login almacenado
  checkLogin();

})();
</script>
</body>
</html>
